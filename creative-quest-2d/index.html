function bossScreen(){if(!$('bossStage'))return;let phase=save.bossPhase;$('hp').innerHTML=[0,1,2].map(i=>`<b class="${i<phase?'gone':''}">♥</b>`).join('');let div=$('bossStage');if(phase===0){div.innerHTML='<span class="label">الدرع الأول: اختر Observation</span><div class="choices"><button class="choice" data-v="0">الناس خايفة من أسعار المعرض.</button><button class="choice" data-v="1">بعض الزوار بيتنقلوا بين الأجنحة وبيصوروا المنتجات.</button><button class="choice" data-v="2">الزوار بيحبوا يضيّعوا وقتهم.</button></div><div id="bossFeedback"></div>';div.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.v==='1'){save.bossPhase=1;persist();$('bossFeedback').innerHTML='<div class="feedback">✓ درع اتكسر! وصفت فعل ظاهر مش مشاعر.</div><button class="btn" id="advance">اكسر الدرع الثاني ↗</button>';$('advance').onclick=bossScreen;div.querySelectorAll('.choice').forEach(x=>x.disabled=true)}else $('bossFeedback').innerHTML='<div class="feedback bad">ده تفسير لدافع الزوار، مش سلوك واضح. جرّب تاني.</div>'})}else if(phase===1){div.innerHTML=`<span class="label">الدرع الثاني: خلّص الملاحظة وقارنها بافتراض</span><div class="quotes">${BOSS_NOTES.map(t=>`<div class="quote">${t}</div>`).join('')}</div><div class="mission">اكتب Observation واحدة مشتركة، واكتب بعدها تفسير محتمل مش مثبت من التعليقات.</div><textarea class="answer" id="bossAnswer" placeholder="الملاحظة: ...\nالتفسير المحتمل: ..."></textarea><div class="actions"><button class="btn" id="hitBoss">⚔ اكسر الدرع</button></div><div id="bossFeedback"></div>`;$('hitBoss').onclick=()=>{let v=norm($('bossAnswer').value),plausible=v.length>55&&any(v,['زوار','معرض','ناس','زائر'])&&any(v,['صور','يسأل','سجل','تنقل','شوف','رجع'])&&any(v,['يمكن','ممكن','تفسير','احتمال','افتراض','مش مؤكد','مش مثبت']);if(plausible){save.bossPhase=2;persist();bossScreen();say('✓ اتكسر الدرع التاني')}else{$('bossFeedback').innerHTML='<div class="feedback bad">محتاج جملتين: فعل الناس، وبعده تفسير محتمل مع توضيح إنه احتمال. الحكم هنا لغوي محدود.</div><button class="btn alt" id="discuss">انتقل لنقاش ChatGPT</button>';$('discuss').onclick=()=>{save.bossPhase=2;persist();bossScreen()}}}}else if(phase===2){div.innerHTML=`<span class="label">الدرع الأخير: ناقش التفكير</span><p class="story">هنفتح ChatGPT علشان تناقش إجابتك بصياغتك بحرية. مش هنستخدم OpenAI API مدفوع. انسخ التحدي والصقه في محادثة ChatGPT.</p><div class="actions"><button class="btn" id="copy">انسخ التحدي</button><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" class="btn alt" style="text-decoration:none">افتح ChatGPT ↗</a></div><p class="fine">نتيجة المناقشة مش بترجع للعبة تلقائيًا؛ النجاح بيتسجل يدويًا بعد التقييم.</p><button class="btn red" id="victory">✓ نجحت في المناقشة</button>`;$('copy').onclick=async()=>{let text=`أنا بلعب Creative Quest. ده Boss Level 10 لتعلّم Observation. ناقشني كمدرب Creative Thinking مصري صارم، ومتدينيش الحل قبل ما أجاوب.\n\nالشهادات الافتراضية:\n${BOSS_NOTES.join('\n')}\n\nالمطلوب: Observation مشتركة + تفسير محتمل غير مثبت، وبعدها أسئلة توضيح تفرق بين الوصف والاستنتاج. قيّمني من 10 على الدقة، عدم التعميم، وعدم الخلط بين السلوك والدافع. لو جبت 8/10 أو أكثر قولي نجحت، وإلا خليني أصلّح إجابتي.`;try{await navigator.clipboard.writeText(text);say('التحدي اتنسخ — الصقه في ChatGPT')}catch(e){let t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();say('اتنسخ التحدي')}};$('victory').onclick=()=>{if(!confirm('هل حصلت على 8/10 أو أعلى في مناقشة ChatGPT؟ التسجيل يدوي ومش بيتحقق تلقائيًا.'))return;save.bossPhase=3;if(!save.done.includes(10)){save.done.push(10);save.xp+=50;persist();refresh();celebrate(MARKS[9].x,MARKS[9].y)}bossScreen()}}else{div.innerHTML='<div class="feedback"><strong>🏆 انتصرت على وحش الافتراضات!</strong>خلصت عالم الملاحظة. باقي العوالم لسه قيد التطوير.</div><div class="actions"><button id="finish" class="btn">ارجع للخريطة ↗</button></div>';$('finish').onclick=closeDialog}}
function intro(){modal('أهلًا بيك في غابة الملاحظة','NEW GAME · ADVENTURE 2D',`<div class="heroArt">🧝🏻‍♂️</div><div class="center"><h2>CREATIVE QUEST</h2><p class="story">هنا مش بتقلب كروت. إنت شخصية بتتحرك على خريطة، تقابل حراس، وتحل تحديات Creative Thinking. وفي آخر العالم Boss لازم تهزمه علشان تكسب.</p><span class="chip">2D WORLD</span><span class="chip">10 LEVELS</span><span class="chip">1 BOSS</span><span class="chip">NO API</span></div><p class="story center">حرّك الشخصية بالعصاية، أو المس أي مكان على الخريطة. قرب من الحارس واضغط «تفاعل».</p><div class="actions" style="justify-content:center"><button class="btn" id="start">ابدأ المغامرة ⚔</button></div><p class="fine center">أول عالم فقط متاح في النسخة دي. الـ490 Level الباقيين لسه مش متبرمجين.</p>`);$('start').onclick=()=>{save.started=true;persist();closeDialog();say('اتبع الطريق البني للحارس المضيء!')}}
function worldMap(){modal('أبواب العوالم','THE CREATIVE MAP',`<p class="story">لما تتقدم هتفتح عوالم بتعلّمك مهارات مختلفة. دلوقتي العالم الأول فقط قابل للعب.</p><div class="worldTile"><b>01 — غابة الملاحظة</b> — ${save.done.length}/10 Levels — مفتوحة</div><div class="worldTile">🔒 02 — وادي الصراع / Tension</div><div class="worldTile">🔒 03 — مختبر Insight</div><div class="worldTile">🔒 04 — أبواب Creative Territories</div><div class="worldTile">🔒 05+ — Concepts / Mechanisms / Visual KVs / Campaigns</div><div class="actions"><button class="btn" id="back">ارجع للخريطة</button></div>`);$('back').onclick=closeDialog}
function menu(){modal('خيارات المغامرة','CREATIVE QUEST 2D · v0.2',`<p class="story">الحركة: عصا التحكم، أو لمس الخريطة، أو الأسهم/WASD. الحارس المضيء هو المرحلة الحالية. بعد المواجهة هتتفتح المرحلة اللي بعدها.</p><div class="actions"><button class="btn" id="resume">كمّل اللعب</button><button class="btn alt" id="maps">أبواب العوالم</button><button class="btn red" id="reset">ابدأ من جديد</button></div><p class="fine">التقدم محفوظ محليًا على المتصفح فقط. مسح بيانات الموقع ممكن يمسحه. تقييم الإجابات المفتوحة ليس ذكاءً اصطناعيًا.</p>`);$('resume').onclick=closeDialog;$('maps').onclick=worldMap;$('reset').onclick=()=>{if(!confirm('تمسح التقدم وتبدأ من Level 1؟'))return;save=newSave();save.started=true;persist();player.x=SPAWN.x;player.y=SPAWN.y;destination=null;closeDialog();refresh();say('رحلة جديدة بدأت')}}
refresh();requestAnimationFrame(tick);if(!save.started)intro();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}

</script></body></html>
