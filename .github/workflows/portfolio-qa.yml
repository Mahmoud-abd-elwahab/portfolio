name: Portfolio hiring-readiness QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'case.html'
      - 'portfolio-*.js'
      - 'portfolio-*.css'
      - 'tests/**'
      - '.github/workflows/portfolio-qa.yml'
  workflow_dispatch:
jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static source integrity and copy checks
        run: node tests/static-audit.cjs
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop, tablet and mobile QA
        run: npx playwright test --reporter=line
      - name: Save screenshots on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
